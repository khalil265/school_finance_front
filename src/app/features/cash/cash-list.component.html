<div class="page-header">
  <h1>Gestion des Caisses</h1>
  <button class="primary" (click)="openCreateCashModal()">+ Nouvelle Caisse</button>
</div>

<div class="cash-grid">
  <div class="cash-card" *ngFor="let c of cashAccounts">
    <div class="cash-info">
      <h3>{{ c.name }}</h3>
      <span class="balance">{{ c.balance | number:'1.0-0' }} FCFA</span>
    </div>
    <div class="cash-actions">
      <button (click)="viewTransactions(c.id)">Historique</button>
      <button class="secondary" (click)="makeAdjustment(c.id)">Ajustement</button>
    </div>
  </div>
</div>
